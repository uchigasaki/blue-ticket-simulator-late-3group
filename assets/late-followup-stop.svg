  <path d="M248 255H323" stroke="#fff" stroke-width="12"/>
  <path d="M184 218V286" stroke="#68727c" stroke-width="7"/>
  <path d="M142 191H226L184 261Z" fill="#b43d3d" stroke="#fff" stroke-width="4"/>
  <text x="184" y="215" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fff">止まれ</text>
  <text x="184" y="235" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">STOP</text>
  <g fill="none" stroke="#285878" stroke-width="5" stroke-linecap="round">
