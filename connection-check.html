<body>
  <main class="site">
    <header class="header"><div class="brand"><h1>Google接続の確認</h1><p>Blue Ticket Simulator</p></div></header>
    <section class="card stack">
      <p>Googleへの接続だけを確認します。参加者ID・メールアドレス・回答を送信せず、割付や回答記録は作成しません。</p>
      <p class="notice">「接続できました」は、回答保存や実験完了の確認ではありません。Googleへのログインは不要です。</p>
      <button id="connectionCheckButton" class="btn" type="button">接続を確認する</button>
      <p id="connectionCheckStatus" role="status" aria-live="polite">ボタンを押すと確認します。</p>
      <p class="notice">接続できない場合は、このページの結果と、使用したブラウザー名を研究者へお知らせください。回答や個人用リンクを送る必要はありません。</p>
      <noscript>この接続確認にはJavaScriptを有効にしてください。</noscript>
    </section>
  </main>
  <script src="./experiment-config.js?v=20261002-connection-v3"></script>
